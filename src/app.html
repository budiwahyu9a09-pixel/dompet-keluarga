<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keuangan Rumah Tangga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef6ff; --card:#ffffff; --ink:#1b2440; --ink2:#46506e; --muted:#7d87a6; --line:#dde8f7; --soft:#f1f6fd;
  --pri:#3d8be0; --pri2:#7cc0ff; --pri-soft:#e1efff;
  --inc:#139a7b; --inc-soft:#dcf7ee; --exp:#e2557a; --exp-soft:#ffe6ee;
  --warn:#c98a12; --warn-soft:#fff3d6; --lilac:#e9e2ff; --peach:#ffe9dc; --mint:#dcf7ee; --butter:#fff6cc;
  --p1:#3d8be0; --p2:#e9774f; --p3:#1fa58a; --p4:#9370dd;
  --shadow:0 2px 0 rgba(61,139,224,.06),0 10px 28px rgba(61,139,224,.10);
  --r:24px; --grad:linear-gradient(135deg,#4f9ae8,#7b7ff0); --hero-ink:#1b2440; --hero-glass:rgba(255,255,255,.62);
  --heroBg:linear-gradient(135deg,#bfe0ff 0%,#cfe0ff 45%,#e3d6ff 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bgImg,var(--bg));background-color:var(--bg);background-attachment:fixed;transition:background-color .3s;color:var(--ink);min-height:100vh;
  padding-bottom:150px;-webkit-tap-highlight-color:transparent;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px}
/* header */
.top{display:flex;align-items:center;gap:7px;margin-bottom:16px}
.top .hi{flex:1;min-width:0}
.top .hi small{color:var(--muted);font-size:12.5px;font-weight:500}
.top .hi h1{font-size:21px;font-weight:800;letter-spacing:-.6px;line-height:1.2}
.streak{display:flex;align-items:center;gap:3px;background:var(--peach);color:#d9622b;font-weight:700;font-size:12.5px;padding:7px 9px;flex-shrink:0;border-radius:99px;border:0}
.iconbtn{width:36px;height:36px;flex-shrink:0;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:19px;height:19px}
.sync{font-size:11.5px;color:var(--muted);margin:-8px 0 12px}
.banner{font-size:12.5px;padding:11px 13px;border-radius:14px;margin-bottom:12px;background:var(--warn-soft);line-height:1.5}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.sec h2{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.sec .lnk{font-size:12.5px;font-weight:700;color:var(--pri);background:none;border:0}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px}
/* hero */
.hero{background:var(--heroBg);color:var(--hero-ink);min-height:250px;border:0;position:relative;overflow:hidden;padding:18px}
.hero .mrow{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.mpick{display:flex;align-items:center;gap:2px;background:var(--hero-glass);backdrop-filter:blur(6px);border-radius:99px;padding:3px}
.mpick button{border:0;background:transparent;color:var(--hero-ink);width:28px;height:28px;border-radius:50%;font-size:16px}
.mpick span{font-size:12.5px;font-weight:600;padding:0 4px;min-width:74px;text-align:center}
.hero .lbl{font-size:12.5px;opacity:.85}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin:8px 0 2px;position:relative;z-index:1}
.hero .hint2{font-size:12px;opacity:.85;position:relative;z-index:1}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:relative;z-index:1}
.flow div{background:var(--hero-glass);border-radius:14px;padding:10px 12px;backdrop-filter:blur(4px)}
.flow small{font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:5px}
.flow b{display:block;font-size:15.5px;margin-top:3px;letter-spacing:-.2px}
.spendbar{height:9px;border-radius:99px;background:var(--hero-glass);margin-top:14px;overflow:hidden;position:relative;z-index:1}
.spendbar i{display:block;height:100%;background:var(--grad);border-radius:99px}
/* pockets */
.pockets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pocket{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pocket .pe{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:17px;margin-bottom:10px}
.pocket small{font-size:12px;color:var(--muted);font-weight:600;display:block}
.pocket b{font-size:15px;font-weight:800;letter-spacing:-.3px;display:block;margin-top:2px}
.pocket .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.totalsave{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 2px}
.totalsave small{color:var(--muted);font-size:12px} .totalsave b{font-size:17px;font-weight:800}
.alloc{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:12px;background:var(--soft)}
.alloc i{display:block;height:100%}
/* goals */
.glist{display:flex;flex-direction:column;gap:10px}
.gitem{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow);text-align:left;width:100%}
.ring{position:relative;width:54px;height:54px;flex-shrink:0}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.gitem .gm{flex:1;min-width:0}
.gitem .gm b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem .gm small{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.gitem .gr{text-align:right}
.gitem .gr b{font-size:14px;font-weight:800}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);margin-top:4px;white-space:nowrap}
.chip.ok{background:var(--inc-soft);color:var(--inc)} .chip.bad{background:var(--exp-soft);color:var(--exp)}
/* today */
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today>div{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow)}
.today small{font-size:12px;color:var(--muted);font-weight:600}
.today b{display:block;font-size:16px;margin-top:4px}
.moodq{display:flex;justify-content:space-between;margin-top:8px}
.moodq button{border:0;background:var(--soft);width:34px;height:34px;border-radius:10px;font-size:18px;transition:transform .15s}
.moodq button:active{transform:scale(1.25)}
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0;padding-bottom:0} .insight:first-child{padding-top:0}
.insight .ie{width:36px;height:36px;border-radius:12px;background:var(--pri-soft);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.insight:nth-child(2) .ie{background:var(--lilac)}.insight:nth-child(3) .ie{background:var(--peach)}.insight:nth-child(4) .ie{background:var(--mint)}.insight:nth-child(5) .ie{background:var(--butter)}
.insight p{font-size:13px;line-height:1.5;color:var(--ink2)} .insight p b{color:var(--ink)}
/* tx list */
.list{list-style:none}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:var(--soft)}
.ic.in{background:var(--inc-soft)} .ic.out{background:var(--exp-soft)}
.tx .mid{flex:1;min-width:0}
.tx .mid b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid small{font-size:12px;color:var(--muted)}
.amt{font-size:13.5px;font-weight:700;white-space:nowrap}
.amt.in{color:var(--inc)} .amt.out{color:var(--exp)} .amt.mv{color:var(--ink2)}
.day{font-size:11.5px;color:var(--muted);font-weight:700;margin:16px 0 2px;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between}
.day:first-child{margin-top:0}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 8px;line-height:1.6}
.empty .ee{font-size:34px;display:block;margin-bottom:6px}
/* segmented */
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pnav button{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px}
.pnav b{font-size:15px;font-weight:800}
.pnav small{display:block;text-align:center;font-size:11.5px;color:var(--muted);font-weight:500}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi div{background:var(--soft);border-radius:14px;padding:10px}
.kpi small{font-size:11px;color:var(--muted);font-weight:600} .kpi b{display:block;font-size:13.5px;margin-top:3px;letter-spacing:-.2px}
/* chart */
.chart{position:relative;margin-top:14px}
.chart svg{width:100%;display:block;overflow:visible}
.chart .tip{position:absolute;background:var(--ink);color:var(--card);font-size:12px;padding:6px 9px;border-radius:9px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;font-weight:600}
.chart .tip.show{opacity:1}
.chart .tip small{display:block;font-weight:500;opacity:.75;font-size:11px}
/* budget rows */
.brow{margin-bottom:13px}
.brow:last-child{margin-bottom:0}
.brow .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:8px;align-items:center}
.brow .t span:first-child{font-weight:600}
.brow .t span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--exp)} .bar i.nob{background:var(--muted);opacity:.45}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cell{aspect-ratio:1/1.12;border-radius:12px;border:0;background:var(--soft);padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;min-width:0}
.cell.out{background:transparent;opacity:.35}
.cell .dn{font-size:12.5px;font-weight:700}
.cell .mo{font-size:13px;line-height:1}
.cell .ca{font-size:9px;font-weight:700;color:var(--exp);white-space:nowrap;letter-spacing:-.2px}
.cell .dots{display:flex;gap:2px;margin-top:auto}
.cell .dots i{width:5px;height:5px;border-radius:50%}
.cell.today{box-shadow:inset 0 0 0 2px var(--pri)}
.cell.sel{background:var(--grad);color:#fff} .cell.sel .ca{color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* notes */
.note{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.note:last-child{border-bottom:0}
.note .nh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.note .nm{font-size:26px}
.note .nh b{font-size:13.5px;display:block} .note .nh small{font-size:12px;color:var(--muted)}
.note p{font-size:13.5px;line-height:1.55;color:var(--ink2);white-space:pre-wrap;word-wrap:break-word}
.note .gr{margin-top:8px;font-size:12.5px;background:var(--butter);padding:8px 10px;border-radius:10px;color:var(--ink2)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--lilac);color:var(--ink2)}
.moodsum{display:flex;justify-content:space-around;text-align:center}
.moodsum div{font-size:24px} .moodsum small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 4px 8px}
nav button{border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--pri)}
.fab{position:fixed;right:max(16px,calc(50vw - 294px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;
  background:var(--grad);color:#fff;font-size:30px;font-weight:400;box-shadow:0 10px 24px rgba(40,40,90,.28);z-index:11;display:grid;place-items:center;transition:transform .2s}
.fab:active{transform:scale(.92)}
.fab.open{transform:rotate(45deg)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,16,14,.5);display:none;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
.ov.show{display:flex}
.ov.clear{background:rgba(10,16,14,.08);backdrop-filter:none}
.sheet{background:var(--card);width:100%;max-width:620px;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.9,.3,1.1)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:4px;letter-spacing:-.3px}
.sheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.5}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:13px;padding:12px;font:inherit;font-size:15px}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
.money{font-size:26px;font-weight:800;letter-spacing:-.5px;padding:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:20px}
.actions .btn{flex:1}
.btn{border:0;border-radius:16px;padding:13px 14px;font-size:14.5px;font-weight:700;background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(40,40,90,.18)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--exp-soft);color:var(--exp);flex:0 0 auto;box-shadow:none}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:11px}
.btn:disabled{opacity:.5}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.catgrid button{border:1.5px solid var(--line);background:var(--bg);border-radius:13px;padding:9px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink2);line-height:1.2;text-align:center}
.catgrid button span{font-size:20px}
.catgrid button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--ink)}
.picks{display:flex;flex-wrap:wrap;gap:7px}
.bankpick{gap:6px}
.bankpick button{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 11px 5px 5px;font-size:12.5px}
.bb{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:800;font-style:normal;color:#1b2440;letter-spacing:-.2px}
.bankrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bankrow:last-child{border-bottom:0}
.bankrow .bb{min-width:34px;height:34px;border-radius:11px;font-size:12px}
.bankrow .bm{flex:1;min-width:0}.bankrow .bm b{font-size:13.5px;display:block}.bankrow .bm small{font-size:12px;color:var(--muted)}
.bankrow .br{text-align:right;font-size:12.5px;font-weight:700;white-space:nowrap}
.bankrow .x{border:0;background:var(--exp-soft);color:var(--exp);width:30px;height:30px;border-radius:10px;font-size:14px}
.picks button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600}
.picks button.on{border-color:var(--pri);background:var(--pri-soft)}
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 0;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:2px}
.moods button small{font-size:10px;font-weight:700;color:var(--muted)}
.moods button.on{border-color:var(--pri);background:var(--pri-soft);transform:scale(1.04)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.quick button{border:0;border-radius:20px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.quick button:nth-child(1){background:var(--exp-soft)}.quick button:nth-child(2){background:var(--mint)}.quick button:nth-child(3){background:var(--pri-soft)}.quick button:nth-child(4){background:var(--lilac)}.quick button:nth-child(5){background:var(--butter)}
.quick button span{font-size:24px}
.quick button b{font-size:14px} .quick button small{font-size:11.5px;color:var(--muted);margin-top:-6px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:20px}
.emojis button.on{border-color:var(--pri);background:var(--pri-soft)}
.budget-in{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.budget-in span{flex:1;font-size:13.5px;font-weight:600}
.budget-in span small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.budget-in input{width:140px;padding:9px;font-size:14px;text-align:right}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.balbig{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:4px 0 2px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:40;opacity:0;transition:.22s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bookbtn{border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:2px 0;max-width:100%;text-align:left}
.bookbtn .be{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:var(--heroBg)}
.bookbtn h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookbtn .chev{font-size:13px;color:var(--muted);flex-shrink:0;margin-top:3px}
.booklist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bookrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);text-align:left;width:100%}
.bookrow.on{border-color:var(--pri);background:var(--pri-soft)}
.bookrow .be{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex-shrink:0}

.themes button.on{border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}

.sw.on{background:var(--pri)} .sw.on::after{left:21px}
.vis{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.vis button b{display:block;font-size:13.5px}.vis button small{font-size:11.5px;color:var(--muted);line-height:1.4;display:block;margin-top:3px}
.vis button.on{border-color:var(--pri);background:var(--pri-soft)}
.vis button:disabled{opacity:.45}
.scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
html.dark .scene{opacity:.8}
.hero .lbl{position:relative;z-index:1}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scenes button{border:2.5px solid transparent;border-radius:18px;padding:0;overflow:hidden;background:var(--soft);text-align:left}
.scenes button.on{border-color:var(--pri)}
.scenes .pv{height:64px;position:relative;overflow:hidden}
.scenes .pv svg{position:absolute;inset:0;width:100%;height:100%}
.scenes b{display:block;font-size:12.5px;padding:6px 8px 7px;white-space:nowrap}
.accents{display:flex;gap:10px;flex-wrap:wrap}
.accents button{width:42px;height:42px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.accents button.on{box-shadow:0 0 0 3px var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d||1); };
const ym = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const today = () => iso(new Date());
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const shiftMonth = (m,n) => { const [y,mm]=m.split('-').map(Number); return ym(new Date(y,mm-1+n,1)); };
const weekStart = s => { const d=parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
const daysIn = m => { const [y,mm]=m.split('-').map(Number); return new Date(y,mm,0).getDate(); };
const monthsBetween = (a,b) => { const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number); return (y2-y1)*12+(m2-m1); };
const rp = n => (n<0?'−':'')+'Rp '+Math.round(Math.abs(n||0)).toLocaleString('id-ID');
const rpS = n => { const a=Math.abs(n||0), s=n<0?'−':''; if(a>=1e9) return s+'Rp '+(a/1e9).toLocaleString('id-ID',{maximumFractionDigits:1})+' M'; if(a>=1e6) return s+'Rp '+(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt'; if(a>=1e3) return s+'Rp '+Math.round(a/1e3)+' rb'; return s+'Rp '+Math.round(a); };
const rpT = n => { const a=Math.abs(n||0); if(a>=1e6) return (a/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+'jt'; if(a>=1e3) return Math.round(a/1e3)+'rb'; return String(Math.round(a)); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(String(v).replace(/[^\d]/g,''))||0;
const fmtN = n => n? Math.round(n).toLocaleString('id-ID') : '';
const mLabel = m => { const [y,mm]=m.split('-'); return MONTHS[+mm-1]+' '+y; };
const mShort = m => { const [y,mm]=m.split('-'); return MONTHS[+mm-1].slice(0,3)+' '+y; };
const dLong = s => parse(s).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
const dShort = s => parse(s).toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const dayRel = s => s===today()?'Hari ini':s===addDays(today(),-1)?'Kemarin':dLong(s);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const catIcon = (type,cat) => (type==='in'?IN_CATS:OUT_CATS).find(c=>c[0]===cat)?.[1] || (type==='in'?'💰':'📦');
const pk = k => POCKETS.find(p=>p.k===k);
const banks = () => (S.config.banks&&S.config.banks.length)? S.config.banks : DEFAULT_BANKS;
const bankColor = b => BANK_COLORS[b] || PASTELS[[...b].reduce((a,c)=>a+c.charCodeAt(0),0)%PASTELS.length];
const bankAbbr = b => { if(b==='Tunai') return '💵'; if(b.length<=4) return b; const caps=(b.match(/[A-Z0-9]/g)||[]).join(''); if(caps.length>=2) return caps.slice(0,3); const w=b.split(/\s+/).filter(Boolean); return (w.length>1? w.map(x=>x[0]).join('') : b.slice(0,2)).slice(0,3).toUpperCase(); };
const bankBadge = b => `<i class="bb" style="background:${bankColor(b)}">${esc(bankAbbr(b))}</i>`;
function lastBank(){ try{ return localStorage.getItem('kk_lastBank')||''; }catch(e){ return ''; } }
function rememberBank(b){ try{ if(b) localStorage.setItem('kk_lastBank',b); }catch(e){} }
function bankPicker(sel,label){
  return `<label>${label}</label><div class="picks bankpick" id="bankPick">${banks().map(b=>`<button type="button" data-bank="${esc(b)}" class="${b===sel?'on':''}">${bankBadge(b)}${esc(b)}</button>`).join('')}<button type="button" id="bankAdd">＋ Lainnya</button></div>
  <div id="bankAddRow" style="display:none;gap:8px;margin-top:8px"><input id="bankNew" maxlength="30" placeholder="Nama bank / e-wallet"><button type="button" class="btn sm" id="bankNewOk">Tambah</button></div>`;
}
function bindBankPicker(st){
  const wrap=$('bankPick'); if(!wrap) return;
  const sel=b=>{ st.bank = st.bank===b? '' : b; wrap.querySelectorAll('[data-bank]').forEach(x=>x.classList.toggle('on',x.dataset.bank===st.bank)); };
  wrap.querySelectorAll('[data-bank]').forEach(x=>x.onclick=()=>sel(x.dataset.bank));
  $('bankAdd').onclick=()=>{ $('bankAddRow').style.display='flex'; $('bankNew').focus(); };
  $('bankNewOk').onclick=async()=>{ const n=$('bankNew').value.trim().slice(0,30); if(!n) return;
    if(!banks().includes(n)){ await saveConfig({...S.config,banks:[...banks(),n]}); }
    const btn=document.createElement('button'); btn.type='button'; btn.dataset.bank=n; btn.innerHTML=bankBadge(n)+esc(n); btn.onclick=()=>sel(n);
    if(!wrap.querySelector(`[data-bank="${CSS.escape(n)}"]`)) wrap.insertBefore(btn,$('bankAdd'));
    st.bank=''; sel(n); $('bankAddRow').style.display='none'; $('bankNew').value=''; };
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2300)}
function confetti(){ const cols=['#7cc0ff','#ffb4c8','#a8ecd2','#c9b8ff','#ffe28a']; for(let i=0;i<40;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDelay=Math.random()*.4+'s';c.style.animationDuration=1.2+Math.random()*.9+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2600);} }

// ================= data layer =================
const mem={};  // memory fallback per book
let unsubs=[];
function memBook(k){ return mem[k]=mem[k]||{tx:[],goals:[],notes:[],config:{budgets:{},pocketStart:{}}}; }
function parseKey(k){ const [t,...r]=k.split(':'); return {private:t==='p', id:r.join(':')}; }
function allBooks(){
  const sm=S.sharedBooks.find(b=>b.id==='main')||{};
  const main={name:'Rumah Tangga',emoji:'🏠',theme:'biru',features:ALL_ON,...sm,id:'main',private:false};
  return [main,...S.sharedBooks.filter(b=>b.id!=='main').map(b=>({...b,private:false})),...S.privBooks.map(b=>({...b,private:true}))];
}
const keyOf = b => (b.private?'p:':'s:')+b.id;
function curBook(){ const k=parseKey(S.bookKey); return allBooks().find(b=>b.id===k.id&&b.private===k.private) || {id:k.id,private:k.private,name:k.id==='main'?'Rumah Tangga':'…',emoji:k.id==='main'?'🏠':'📁',theme:'biru',features:ALL_ON}; }
const feat = f => { const fs=curBook().features||ALL_ON; return fs[f]!==false; };
const canWrite = () => parseKey(S.bookKey).private || !S.readonly;
function baseRef(key){ const k=parseKey(key); if(!k.private && k.id==='main') return null; return k.private? db.doc('data/users/'+me+'/'+k.id) : db.doc('books/'+k.id); }
function colRef(name,key=S.bookKey){ const b=baseRef(key); return b? b.collection(name) : db.collection(name); }
function cfgRef(key=S.bookKey){ const b=baseRef(key); return b? b.collection('meta').doc('config') : db.doc('config/main'); }
function bookMetaRef(b){ return b.private? db.doc('data/users/'+me+'/'+b.id) : db.doc('books/'+b.id); }

async function save(col,id,data){
  if(!canWrite()){toast('Akses kamu hanya lihat');return false}
  if(!db){ const arr=S[col]; const i=arr.findIndex(x=>x.id===id); if(i>=0) arr[i]={...data,id}; else arr.push({...data,id}); render(); return true; }
  try{ await colRef(col).doc(id).set(data); return true; }catch(e){ return fail(e); }
}
async function del(col,id){
  if(!canWrite()){toast('Akses kamu hanya lihat');return false}
  if(!db){ const arr=S[col]; const i=arr.findIndex(x=>x.id===id); if(i>=0) arr.splice(i,1); render(); return true; }
  try{ await colRef(col).doc(id).delete(); return true; }catch(e){ return fail(e); }
}
async function saveConfig(cfg){
  if(!canWrite()){toast('Akses kamu hanya lihat');return false}
  S.config=cfg; if(!db){ memBook(S.bookKey).config=cfg; render(); return true; }
  try{ await cfgRef().set(cfg); return true; }catch(e){ return fail(e); }
}
function fail(e){
  if(e?.code==='invalid_argument'){ if(!parseKey(S.bookKey).private) S.readonly=true; toast('Tidak bisa menyimpan — akses kamu hanya lihat');}
  else if(e?.code==='quota_exceeded') toast('Penyimpanan penuh. Hapus beberapa data lama.');
  else toast('Gagal menyimpan, coba lagi.');
  return false;
}
function syncLabel(){ const b=curBook(); if(!db) return 'Mode coba · data tidak tersimpan'; return (b.private?'🔒 Pribadi · ':'👥 Bersama · ')+(S.ready? (canWrite()?'tersinkron ✓':'akses lihat') : 'memuat…'); }

function switchBook(key){
  if(key.startsWith('p:') && !me && db){ key='s:main'; }
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[];
  S.bookKey=key; try{ localStorage.setItem('kk_book',key); }catch(e){}
  if(!db){ const m=memBook(key); S.tx=m.tx; S.goals=m.goals; S.notes=m.notes; S.config=m.config; S.ready=true; fixTab(); render(); return; }
  S.tx=[]; S.goals=[]; S.notes=[]; S.config={budgets:{},pocketStart:{}}; S.ready=false; render();
  const seen={}; const KEYS=['tx','goals','notes','cfg']; const myKey=key;
  const timer=setTimeout(()=>{ if(S.bookKey===myKey && !S.ready){ S.ready=true; $('sync').textContent='Belum terhubung · data mungkin belum terbaru'; render(); } },10000);
  const mark=(k,snap)=>{ if(S.bookKey!==myKey) return; if(!seen[k] && snap.metadata && !snap.metadata.fromCache){ seen[k]=1; if(KEYS.every(x=>seen[x])){ clearTimeout(timer); S.ready=true; } } if(S.ready||KEYS.every(x=>seen[x])) render(); };
  const err=()=>{ if(S.bookKey!==myKey) return; clearTimeout(timer); S.ready=true; render(); $('sync').textContent='Koneksi data terputus — muat ulang halaman'; };
  try{
    unsubs.push(colRef('tx',key).onSnapshot(sn=>{ if(S.bookKey!==myKey) return; S.tx=sn.docs.map(d=>({...d.data(),id:d.id})); mark('tx',sn); },err));
    unsubs.push(colRef('goals',key).onSnapshot(sn=>{ if(S.bookKey!==myKey) return; S.goals=sn.docs.map(d=>({...d.data(),id:d.id})); mark('goals',sn); },err));
    unsubs.push(colRef('notes',key).onSnapshot(sn=>{ if(S.bookKey!==myKey) return; S.notes=sn.docs.map(d=>({...d.data(),id:d.id})); mark('notes',sn); },err));
    unsubs.push(cfgRef(key).onSnapshot(sn=>{ if(S.bookKey!==myKey) return; const d=sn.exists?sn.data():{}; S.config={budgets:{},pocketStart:{},...d}; mark('cfg',sn); },err));
  }catch(e){ err(); }
}
let knownKeys=new Set(), firstCheck=false;
function booksChanged(){
  const keys=new Set(allBooks().map(keyOf)); const k=S.bookKey;
  const bothLoaded=S.booksLoaded.s&&S.booksLoaded.p;
  const gone = !keys.has(k) && k!=='s:main' && (knownKeys.has(k) || (bothLoaded && !firstCheck));
  if(bothLoaded) firstCheck=true;
  keys.forEach(x=>knownKeys.add(x));
  if(gone){ knownKeys.delete(k); toast('Pos tidak ditemukan, kembali ke Rumah Tangga'); switchBook('s:main'); return; }
  fixTab(); render();
}
async function init(){
  const t=today(); S.month=t.slice(0,7); S.anchor=t; S.calMonth=t.slice(0,7); S.calDay=t;
  let saved='s:main'; try{ saved=localStorage.getItem('kk_book')||'s:main'; }catch(e){}
  render();
  try{ db = await claude.use('db'); }catch(e){ db=null; }
  try{ const u=await claude.use('user'); if(u){ me=await u.id(); try{ if(await u.can('data.write')===false) S.readonly=true; }catch(e){} } }catch(e){}
  if(!db){
    $('banner').innerHTML='<div class="banner">Penyimpanan belum tersedia di tampilan ini. Buka halaman dari claude.ai dalam keadaan login supaya data tersimpan dan bisa dipakai bersama pasangan.</div>';
    S.booksLoaded={s:true,p:true}; switchBook('s:main'); return;
  }
  db.collection('books').onSnapshot(sn=>{ S.sharedBooks=sn.docs.map(d=>({...d.data(),id:d.id})); if(!sn.metadata.fromCache) S.booksLoaded.s=true; booksChanged(); },()=>{});
  if(me){ try{ db.collection('data/users/'+me).onSnapshot(sn=>{ S.privBooks=sn.docs.map(d=>({...d.data(),id:d.id})).filter(b=>b.name); if(!sn.metadata.fromCache) S.booksLoaded.p=true; booksChanged(); },()=>{}); }catch(e){} }
  else S.booksLoaded.p=true;
  switchBook(saved);
}
function fixTab(){ const map={goals:'goals',cal:'cal',notes:'notes'}; if(map[S.tab] && !feat(map[S.tab])) S.tab='home'; }

// ================= computations =================
const txIn = (a,b) => S.tx.filter(t=>t.date>=a && t.date<=b);
function sums(list){
  let inc=0,out=0,goal=0,save=0;
  for(const t of list){
    if(t.type==='in') inc+=t.amount; else if(t.type==='out') out+=t.amount;
    else if(t.type==='goal') goal+=t.amount;
    else if(t.type==='save') save+= t.dir==='out'? -t.amount : t.amount;
  }
  return {inc,out,goal,save,saved:goal+save,net:inc-out};
}
const monthRange = m => [m+'-01', m+'-'+pad(daysIn(m))];
const cash = () => { const s=sums(S.tx); return (S.config.startBalance||0)+s.inc-s.out-s.goal-s.save; };
function pocketBal(k){
  let b=(S.config.pocketStart||{})[k]||0;
  for(const t of S.tx){ if(t.pocket!==k) continue; if(t.type==='save') b+= t.dir==='out'?-t.amount:t.amount; else if(t.type==='adj') b+=t.amount; }
  return b;
}
const goalSaved = id => S.tx.filter(t=>t.type==='goal'&&t.goalId===id).reduce((a,t)=>a+t.amount,0);
function goalStats(g){
  const saved=goalSaved(g.id), remain=Math.max(0,g.target-saved), pct=g.target?Math.min(100,saved/g.target*100):0;
  let perMonth=null, mLeft=null, daysLeft=null;
  if(g.deadline){ mLeft=Math.max(1,monthsBetween(today().slice(0,7),g.deadline.slice(0,7))); perMonth=remain/mLeft; daysLeft=Math.round((parse(g.deadline)-parse(today()))/864e5); }
  const m3=[0,1,2].map(i=>shiftMonth(today().slice(0,7),-i));
  const avg=S.tx.filter(t=>t.type==='goal'&&t.goalId===g.id&&m3.includes(t.date.slice(0,7))).reduce((a,t)=>a+t.amount,0)/3;
  return {saved,remain,pct,perMonth,mLeft,daysLeft,avg};
}
function goalChip(g,s){
  if(s.remain===0) return '<span class="chip ok">Tercapai 🎉</span>';
  if(s.daysLeft!=null && s.daysLeft<0) return '<span class="chip bad">Lewat tenggat</span>';
  if(s.perMonth!=null) return s.avg>0&&s.avg>=s.perMonth? '<span class="chip ok">Sesuai jalur</span>' : `<span class="chip">${rpS(s.perMonth)}/bln</span>`;
  return '';
}
function catSpend(list){ const r={}; for(const t of list) if(t.type==='out') r[t.cat]=(r[t.cat]||0)+t.amount; return r; }
function activeDays(){ const s=new Set(); S.tx.forEach(t=>s.add(t.date)); S.notes.forEach(n=>s.add(n.date)); return s; }
function streak(){ const s=activeDays(); let d=today(); if(!s.has(d)) d=addDays(d,-1); let n=0; while(s.has(d)){ n++; d=addDays(d,-1);} return n; }
function avgMonthlyOut(){ const ms=[1,2,3].map(i=>shiftMonth(today().slice(0,7),-i)); const o=ms.map(m=>{const[a,b]=monthRange(m);return sums(txIn(a,b)).out}).filter(x=>x>0); return o.length?o.reduce((a,b)=>a+b,0)/o.length:0; }

// ================= render =================
function render(){
  const h=new Date().getHours();
  const scK=applyTheme(); $('greet').textContent=(h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam')+' '+SCENES[scK].greet+' · '+new Date().toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
  const bk=curBook(); $('ttl').textContent=bk.name; $('bookEmoji').textContent=bk.emoji||'📁'; $('sync').textContent=syncLabel();
  let vis=0; document.querySelectorAll('nav button').forEach(b=>{ const t=b.dataset.tab; const show=!['goals','cal','notes'].includes(t)||feat(t); b.style.display=show?'':'none'; if(show) vis++; });
  document.querySelector('nav .in').style.gridTemplateColumns='repeat('+vis+',1fr)';
  const st=streak(); $('streak').textContent='🔥 '+st;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=$('view');
  if(!S.ready){ v.innerHTML='<div class="card empty"><span class="ee">⏳</span>Memuat data '+esc(bk.name)+'…</div>'; return; }
  v.innerHTML = '<div class="fade">'+({home:vHome,money:vMoney,goals:vGoals,cal:vCal,notes:vNotes})[S.tab]()+'</div>';
  if(S.tab==='money') bindChart();
}

// ---------- Beranda ----------
function vHome(){
  const [a,b]=monthRange(S.month); const list=txIn(a,b); const s=sums(list);
  const isNow=S.month===today().slice(0,7);
  const spendPct = s.inc? Math.min(100,s.out/s.inc*100) : (s.out?100:0);
  const left = s.inc - s.out - s.saved;
  // pockets
  const bals=POCKETS.map(p=>({...p,b:pocketBal(p.k)})); const totSave=bals.reduce((x,p)=>x+Math.max(0,p.b),0);
  const alloc = totSave? bals.filter(p=>p.b>0).map(p=>`<i style="width:${p.b/totSave*100}%;background:${p.c}" title="${esc(p.n)} ${rp(p.b)}"></i>`).join('') : '';
  // goals nearest
  const goals=S.goals.map(g=>({g,s:goalStats(g)})).filter(x=>x.s.remain>0).sort((x,y)=>(x.g.deadline||'9999').localeCompare(y.g.deadline||'9999')).slice(0,3);
  // today
  const t=today(); const ts=sums(txIn(t,t)); const tNote=S.notes.filter(n=>n.date===t).sort((x,y)=>(y.createdAt||'').localeCompare(x.createdAt||''))[0];
  return `
  <div class="card hero"><div class="scene">${sceneSvg(document.documentElement.dataset.scene)}</div>
    <div class="mrow"><span class="lbl">${isNow?'Sisa uang bulan ini':'Sisa uang '+mLabel(S.month)}</span>
      <div class="mpick"><button data-act="month" data-d="-1" aria-label="Bulan sebelumnya">‹</button><span>${mShort(S.month)}</span><button data-act="month" data-d="1" aria-label="Bulan berikutnya">›</button></div></div>
    <div class="big">${rp(left)}</div>
    <div class="hint2">Saldo dompet/kas: <b>${rp(cash())}</b></div>
    <div class="flow">
      <div><small>↓ Pemasukan</small><b>${rp(s.inc)}</b></div>
      <div><small>↑ Pengeluaran</small><b>${rp(s.out)}</b></div>
    </div>
    <div class="spendbar" title="Pengeluaran dibanding pemasukan"><i style="width:${spendPct}%"></i></div>
    <div class="hint2" style="margin-top:7px">${s.inc? `Terpakai ${Math.round(s.out/s.inc*100)}% dari pemasukan · ditabung ${rpS(s.saved)}` : (s.out? 'Belum ada pemasukan tercatat bulan ini':'Belum ada transaksi — tekan + untuk mulai')}</div>
  </div>

  <div class="today" ${feat('notes')?'':'style="grid-template-columns:1fr"'}>
    <div><small>Pengeluaran hari ini</small><b style="color:var(--exp)">${rp(ts.out)}</b><div class="hint" style="margin-top:4px">${ts.inc?'+ '+rpS(ts.inc)+' masuk':' '}</div></div>
    ${feat('notes')?`<div><small>${tNote?'Catatan hari ini':'Bagaimana harimu?'}</small>
      ${tNote? `<b style="font-size:22px">${MOODS[(tNote.mood||3)-1][0]} <span style="font-size:13px;font-weight:600">${MOODS[(tNote.mood||3)-1][1]}</span></b><div class="hint" style="margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(tNote.text||'')}</div>`
      : `<div class="moodq">${MOODS.map((m,i)=>`<button data-act="noteMood" data-m="${i+1}" aria-label="${m[1]}">${m[0]}</button>`).join('')}</div>`}
    </div>`:''}
  </div>

  ${feat('pockets')?`<div class="sec"><h2>Tabungan</h2><button class="lnk" data-act="pocketSetup">Atur saldo</button></div>
  <div class="totalsave"><small>Total semua kantong</small><b>${rp(bals.reduce((x,p)=>x+p.b,0))}</b></div>
  ${alloc?`<div class="alloc">${alloc}</div>`:''}
  <div class="pockets">${bals.map(p=>`<button class="pocket" data-act="pocket" data-k="${p.k}"><span class="stripe" style="background:${p.c}"></span><div class="pe" style="background:${p.bg}">${p.e}</div><small>${esc(p.n)}</small><b>${rp(p.b)}</b></button>`).join('')}</div>`:''}

  ${feat('goals')?`<div class="sec"><h2>Goals terdekat</h2><button class="lnk" data-act="tab" data-t="goals">Semua</button></div>
  <div class="glist">${goals.length? goals.map(x=>goalItem(x.g,x.s)).join('') : `<div class="card empty"><span class="ee">🎯</span>Belum ada goal aktif.<br><button class="btn sm" style="margin-top:10px" data-act="goalNew">+ Buat goal pertama</button></div>`}</div>`:''}

  <div class="sec"><h2>Insight bulan ini</h2></div>
  <div class="card">${insights(list,s)}</div>

  <div class="sec"><h2>Transaksi terakhir</h2><button class="lnk" data-act="tab" data-t="money">Lihat semua</button></div>
  <div class="card"><ul class="list">${S.tx.slice().sort(byNew).slice(0,5).map(txRow).join('')||'<div class="empty"><span class="ee">🧾</span>Belum ada transaksi.</div>'}</ul></div>`;
}
const byNew=(a,b)=>(b.date+(b.createdAt||'')).localeCompare(a.date+(a.createdAt||''));

function insights(list,s){
  const out=[]; const sp=catSpend(list); const bud=S.config.budgets||{};
  const top=Object.entries(sp).sort((a,b)=>b[1]-a[1])[0];
  if(top && s.out) out.push(['📌',`Pengeluaran terbesar: <b>${esc(top[0])}</b> ${rpS(top[1])} (${Math.round(top[1]/s.out*100)}% dari total).`]);
  const isNow=S.month===today().slice(0,7);
  if(isNow && s.out){ const d=new Date().getDate(), dm=daysIn(S.month); const proj=s.out/d*dm; out.push(['🔮',`Rata-rata keluar <b>${rpS(s.out/d)}/hari</b>. Kalau begini terus, total bulan ini sekitar <b>${rpS(proj)}</b>${s.inc&&proj>s.inc?' — melebihi pemasukan.':'.'}`]); }
  const over=Object.keys(bud).filter(c=>bud[c]&&(sp[c]||0)>bud[c]); const near=Object.keys(bud).filter(c=>bud[c]&&(sp[c]||0)>bud[c]*.8&&(sp[c]||0)<=bud[c]);
  if(over.length) out.push(['🚨',`Melewati anggaran: <b>${over.map(esc).join(', ')}</b>.`]);
  else if(near.length) out.push(['⚠️',`Hampir habis (>80%): <b>${near.map(esc).join(', ')}</b>.`]);
  else if(!Object.keys(bud).length) out.push(['🧭',`Belum ada anggaran. <a href="#" data-act="budget" style="color:var(--pri);font-weight:700">Atur batas per kategori</a> supaya pengeluaran lebih terkendali.`]);
  const em=pocketBal('darurat'), avg=avgMonthlyOut();
  if(avg && feat('pockets')) { const x=em/avg; out.push(['🛟', x>=6? `Dana darurat sudah <b>${x.toFixed(1)}× pengeluaran bulanan</b>. Aman! 👏` : `Dana darurat baru <b>${x.toFixed(1)}×</b> pengeluaran bulanan. Idealnya 6× (${rpS(avg*6)}) untuk keluarga.`]); }
  if(s.inc){ const r=s.saved/s.inc*100; out.push([r>=20?'🌟':'💡', r>=20? `Kamu menabung <b>${Math.round(r)}%</b> dari pemasukan. Di atas target 20% — keren!` : `Porsi tabungan bulan ini <b>${Math.round(r)}%</b>. Coba sisihkan 20% di awal bulan (${rpS(s.inc*.2)}).`]); }
  if(!out.length) return '<div class="empty"><span class="ee">✨</span>Insight akan muncul setelah kamu mencatat beberapa transaksi.</div>';
  return out.map(([e,t])=>`<div class="insight"><div class="ie">${e}</div><p>${t}</p></div>`).join('');
}

function ring(pct,color,emoji){ const r=23,c=2*Math.PI*r; return `<div class="ring"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="${r}" fill="none" stroke="var(--soft)" stroke-width="5"/><circle cx="27" cy="27" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}"/></svg><span>${emoji}</span></div>`; }
function goalItem(g,s){
  const when = g.deadline? (s.daysLeft>=0? (s.daysLeft>60? 'Tenggat '+parse(g.deadline).toLocaleDateString('id-ID',{month:'short',year:'numeric'}) : s.daysLeft+' hari lagi') : 'Tenggat '+dShort(g.deadline)) : 'Tanpa tenggat';
  return `<button class="gitem" data-act="goal" data-id="${esc(g.id)}">${ring(s.pct,s.remain?'var(--pri)':'var(--inc)',esc(g.emoji||'🎯'))}
  <div class="gm"><b>${esc(g.name)}</b><small>${rpS(s.saved)} dari ${rpS(g.target)} · ${when}</small></div>
  <div class="gr"><b>${Math.floor(s.pct)}%</b><br>${goalChip(g,s)}</div></button>`;
}

function txRow(t){
  let title,sub,ic,cls,sign,amtCls;
  if(t.type==='goal'){ const g=S.goals.find(x=>x.id===t.goalId); title='Setor ke '+(g?g.name:'goal'); sub=t.note||'Tabungan goal'; ic=g?.emoji||'🎯'; cls=''; sign='→ '; amtCls='mv'; }
  else if(t.type==='save'){ const p=pk(t.pocket)||{n:'Tabungan',e:'💰'}; title=(t.dir==='out'?'Tarik dari ':'Setor ke ')+p.n; sub=t.note||'Pindah dana'; ic=p.e; cls=''; sign=t.dir==='out'?'← ':'→ '; amtCls='mv'; }
  else if(t.type==='adj'){ const p=pk(t.pocket)||{n:'Tabungan',e:'💰'}; title='Penyesuaian '+p.n; sub=t.note||(t.amount>=0?'Nilai naik':'Nilai turun'); ic='📊'; cls=''; sign=t.amount>=0?'+':''; amtCls='mv'; }
  else { title=t.note||t.cat; sub=t.note?t.cat:dShort(t.date); ic=catIcon(t.type,t.cat); cls=t.type; sign=t.type==='in'?'+':'−'; amtCls=t.type; }
  if(t.bank) sub += ' · '+t.bank;
  return `<li class="tx" data-act="tx" data-id="${esc(t.id)}"><div class="ic ${cls}">${ic}</div><div class="mid"><b>${esc(title)}</b><small>${esc(sub)}</small></div><div class="amt ${amtCls}">${sign}${rp(Math.abs(t.amount)).replace('−','')}</div></li>`;
}

// ---------- Keuangan ----------
function periodRange(){
  const a=S.anchor;
  if(S.period==='day') return [a,a];
  if(S.period==='week'){ const s=weekStart(a); return [s,addDays(s,6)]; }
  return monthRange(a.slice(0,7));
}
function periodLabel(){
  const [a,b]=periodRange();
  if(S.period==='day') return [dayRel(a), a===today()||a===addDays(today(),-1)? dLong(a): ''];
  if(S.period==='week'){ const cur=weekStart(today())===a.slice(0,10)&&false; return [(weekStart(today())===a?'Minggu ini':'Minggu '+dShort(a)), dShort(a)+' – '+dShort(b)]; }
  return [mLabel(a.slice(0,7)), a.slice(0,7)===today().slice(0,7)?'Bulan ini':''];
}
function vMoney(){
  const [a,b]=periodRange(); const list=txIn(a,b); const s=sums(list); const [l1,l2]=periodLabel();
  const sp=catSpend(list); const bud=S.config.budgets||{};
  const isMonth=S.period==='month';
  const cats=OUT_CATS.map(c=>c[0]).filter(c=>sp[c]||(isMonth&&bud[c])).sort((x,y)=>(sp[y]||0)-(sp[x]||0));
  const catHtml = cats.length? cats.map(c=>budRow(c,sp[c]||0,isMonth?bud[c]||0:0,s.out)).join('') : '<div class="empty">Belum ada pengeluaran di periode ini.</div>';
  // list
  const sorted=list.slice().sort(byNew); let html='',last='';
  for(const t of sorted){ if(t.date!==last){ if(last) html+='</ul>'; const ds=sums(list.filter(x=>x.date===t.date)); html+=`<div class="day"><span>${dayRel(t.date)}</span><span>${ds.out?'−'+rpS(ds.out):''}</span></div><ul class="list">`; last=t.date; } html+=txRow(t); }
  if(last) html+='</ul>';
  return `
  <div class="seg">${[['day','Harian'],['week','Mingguan'],['month','Bulanan']].map(([k,l])=>`<button data-act="period" data-p="${k}" class="${S.period===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="pnav"><button data-act="pshift" data-d="-1" aria-label="Sebelumnya">‹</button><div><b>${l1}</b>${l2?`<small>${l2}</small>`:''}</div><button data-act="pshift" data-d="1" aria-label="Berikutnya">›</button></div>
  <div class="card">
    <div class="kpi"><div><small>Masuk</small><b style="color:var(--inc)">${rpS(s.inc)}</b></div><div><small>Keluar</small><b style="color:var(--exp)">${rpS(s.out)}</b></div><div><small>Selisih</small><b>${rpS(s.net)}</b></div></div>
    ${S.period!=='day'? chartHtml(a,b,list) : ''}
    ${s.saved?`<p class="hint" style="margin-top:12px">Dipindahkan ke tabungan & goals: <b>${rp(s.saved)}</b></p>`:''}
  </div>
  <div class="sec"><h2>${isMonth?'Kategori & anggaran':'Per kategori'}</h2>${isMonth?'<button class="lnk" data-act="budget">Atur anggaran</button>':''}</div>
  <div class="card">${catHtml}</div>
  ${bankSummary(list)}
  <div class="sec"><h2>Rincian</h2><button class="lnk" data-act="txNew" data-date="${S.period==='day'?a:''}">+ Catat</button></div>
  <div class="card">${html||'<div class="empty"><span class="ee">🧾</span>Tidak ada transaksi di periode ini.</div>'}</div>`;
}
function bankSummary(list){
  const m={}; for(const t of list){ if(!t.bank||t.type==='adj') continue; const r=m[t.bank]=m[t.bank]||{inc:0,out:0,sav:0};
    if(t.type==='in') r.inc+=t.amount; else if(t.type==='out') r.out+=t.amount; else if(t.type==='goal') r.sav+=t.amount; else if(t.type==='save') r.sav+= t.dir==='out'?-t.amount:t.amount; }
  const rows=Object.entries(m).sort((a,b)=>(b[1].out+b[1].inc)-(a[1].out+a[1].inc));
  if(!rows.length) return '';
  return `<div class="sec"><h2>Per rekening</h2></div><div class="card">${rows.map(([b,r])=>`<div class="bankrow">${bankBadge(b)}<div class="bm"><b>${esc(b)}</b><small>${[r.inc?'masuk '+rpS(r.inc):'',r.sav?'nabung '+rpS(r.sav):''].filter(Boolean).join(' · ')||'&nbsp;'}</small></div><div class="br" style="color:var(--exp)">${r.out?'−'+rpS(r.out):''}</div></div>`).join('')}</div>`;
}
function budRow(c,spent,b,total){
  const pct=b?Math.min(100,spent/b*100):(total?spent/total*100:0);
  const cls=!b?'nob':spent>b?'over':spent>b*.8?'warn':'';
  const right=b? `${rpS(spent)} / ${rpS(b)}${spent>b?' · lewat '+rpS(spent-b):''}` : `${rpS(spent)}${total?' · '+Math.round(spent/total*100)+'%':''}`;
  return `<div class="brow"><div class="t"><span>${catIcon('out',c)} ${esc(c)}</span><span>${right}</span></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div></div>`;
}
let chartData=[];
function chartHtml(a,b,list){
  const days=[]; for(let d=a; d<=b; d=addDays(d,1)) days.push(d);
  chartData=days.map(d=>({d,v:list.filter(t=>t.date===d&&t.type==='out').reduce((x,t)=>x+t.amount,0)}));
  const max=Math.max(...chartData.map(x=>x.v),1);
  const W=320,H=130,top=8,bot=20,n=days.length,gap=n>10?2:8,bw=(W-gap*(n-1))/n;
  const avg=chartData.reduce((x,y)=>x+y.v,0)/n;
  let bars='';
  chartData.forEach((x,i)=>{ const h=x.v?Math.max(3,(H-top-bot)*x.v/max):0; const X=i*(bw+gap); const Y=H-bot-h; const isT=x.d===today();
    bars+=`<rect x="${X}" y="${top}" width="${bw}" height="${H-top-bot}" fill="transparent" data-i="${i}" class="hit"/>`;
    if(h) bars+=`<path d="M${X},${H-bot} V${Y+Math.min(4,h)} Q${X},${Y} ${X+Math.min(4,bw/2)},${Y} H${X+bw-Math.min(4,bw/2)} Q${X+bw},${Y} ${X+bw},${Y+Math.min(4,h)} V${H-bot} Z" fill="var(--exp)" opacity="${isT?1:.78}" pointer-events="none"/>`;
    const lab = n<=7? WD[i] : ((i+1)%5===0||i===0? String(i+1):'');
    if(lab) bars+=`<text x="${X+bw/2}" y="${H-5}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-weight="${isT?800:500}">${lab}</text>`;
  });
  const ay=H-bot-(H-top-bot)*avg/max;
  const avgLine = avg? `<line x1="0" x2="${W}" y1="${ay}" y2="${ay}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/><text x="${W}" y="${ay-4}" text-anchor="end" font-size="9.5" fill="var(--muted)">rata² ${rpT(avg)}</text>` : '';
  return `<div class="chart" id="chart"><div class="hint" style="font-weight:600">Pengeluaran per hari · tertinggi ${rpS(max===1&&!chartData.some(x=>x.v)?0:max)}</div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pengeluaran per hari"><line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="var(--line)"/>${avgLine}${bars}</svg><div class="tip" id="tip"></div>
  <table class="sr"><tr><th>Tanggal</th><th>Pengeluaran</th></tr>${chartData.map(x=>`<tr><td>${x.d}</td><td>${x.v}</td></tr>`).join('')}</table></div>`;
}
function bindChart(){
  const c=$('chart'); if(!c) return; const tip=$('tip'); const svg=c.querySelector('svg');
  const show=e=>{ const r=e.target.closest('.hit'); if(!r){tip.classList.remove('show');return} const x=chartData[+r.dataset.i]; const br=r.getBoundingClientRect(), cr=c.getBoundingClientRect();
    tip.innerHTML=`${rp(x.v)}<small>${parse(x.d).toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})}</small>`; tip.style.left=(br.left-cr.left+br.width/2)+'px'; tip.style.top=(br.top-cr.top+4)+'px'; tip.classList.add('show'); };
  svg.addEventListener('pointermove',show); svg.addEventListener('pointerdown',show); svg.addEventListener('pointerleave',()=>tip.classList.remove('show'));
  svg.addEventListener('click',e=>{ const r=e.target.closest('.hit'); if(r && e.detail===2){ S.period='day'; S.anchor=chartData[+r.dataset.i].d; render(); } });
}

// ---------- Kalender ----------
function vCal(){
  const m=S.calMonth; const first=parse(m+'-01'); const off=(first.getDay()+6)%7; const dim=daysIn(m);
  const start=addDays(m+'-01',-off); const cells=Math.ceil((off+dim)/7)*7;
  const deadlines={}; S.goals.forEach(g=>{ if(g.deadline) (deadlines[g.deadline]=deadlines[g.deadline]||[]).push(g); });
  let g='';
  for(let i=0;i<cells;i++){
    const d=addDays(start,i); const inM=d.slice(0,7)===m;
    const dl=S.tx.filter(t=>t.date===d); const s=sums(dl); const note=S.notes.find(n=>n.date===d);
    const cls=['cell',inM?'':'out',d===today()?'today':'',d===S.calDay?'sel':''].join(' ');
    g+=`<button class="${cls}" data-act="calDay" data-d="${d}" aria-label="${dLong(d)}"><span class="dn">${parse(d).getDate()}</span>
      ${note?`<span class="mo">${MOODS[(note.mood||3)-1][0]}</span>`:deadlines[d]?'<span class="mo">🎯</span>':''}
      ${s.out?`<span class="ca">−${rpT(s.out)}</span>`:''}
      <span class="dots">${s.inc?'<i style="background:var(--inc)"></i>':''}${s.saved?'<i style="background:var(--p1)"></i>':''}${note&&deadlines[d]?'<i style="background:var(--warn)"></i>':''}</span></button>`;
  }
  const [a,b]=monthRange(m); const ms=sums(txIn(a,b));
  const d=S.calDay; const dl=S.tx.filter(t=>t.date===d).sort(byNew); const dn=S.notes.filter(n=>n.date===d).sort((x,y)=>(x.createdAt||'').localeCompare(y.createdAt||''));
  const dg=deadlines[d]||[];
  return `
  <div class="pnav"><button data-act="calM" data-d="-1" aria-label="Bulan sebelumnya">‹</button><div><b>${mLabel(m)}</b><small>Keluar ${rpS(ms.out)} · Masuk ${rpS(ms.inc)}</small></div><button data-act="calM" data-d="1" aria-label="Bulan berikutnya">›</button></div>
  <div class="card" style="padding:12px">
    <div class="cal">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${g}</div>
    <div class="legend"><span><b style="color:var(--exp);font-size:10px">−50rb</b> pengeluaran</span><span><i style="background:var(--inc)"></i>pemasukan</span><span><i style="background:var(--p1)"></i>menabung</span><span>🙂 mood</span><span>🎯 tenggat goal</span></div>
  </div>
  <div class="sec"><h2>${dayRel(d)}</h2>${d!==today()?`<button class="lnk" data-act="calToday">Ke hari ini</button>`:''}</div>
  ${dg.map(x=>`<div class="banner">🎯 Tenggat goal <b>${esc(x.name)}</b> — ${Math.floor(goalStats(x).pct)}% terkumpul</div>`).join('')}
  <div class="card">
    <h3>Catatan harian</h3>
    ${dn.length? dn.map(noteItem).join('') : `<div class="hint">Belum ada catatan.</div>`}
    <div class="actions" style="margin-top:12px"><button class="btn ghost sm" data-act="noteNew" data-date="${d}">📝 Tulis catatan</button></div>
  </div>
  <div class="card">
    <h3>Transaksi ${dl.length?`<span class="hint" style="font-weight:600">· keluar ${rp(sums(dl).out)}</span>`:''}</h3>
    ${dl.length?`<ul class="list">${dl.map(txRow).join('')}</ul>`:'<div class="hint">Tidak ada transaksi.</div>'}
    <div class="actions" style="margin-top:12px"><button class="btn ghost sm" data-act="txNew" data-date="${d}">💸 Catat transaksi</button></div>
  </div>`;
}

// ---------- Goals & Catatan ----------
function vGoals(){
  const items=S.goals.map(g=>({g,s:goalStats(g)}));
  const active=items.filter(x=>x.s.remain>0).sort((x,y)=>(x.g.deadline||'9999').localeCompare(y.g.deadline||'9999'));
  const done=items.filter(x=>x.s.remain===0);
  const tot=items.reduce((a,x)=>a+x.g.target,0), sv=items.reduce((a,x)=>a+Math.min(x.s.saved,x.g.target),0);
  const need=active.filter(x=>x.s.perMonth).reduce((a,x)=>a+x.s.perMonth,0);
  return `<div class="card">
    <div style="display:flex;align-items:center;gap:14px">${ring(tot?sv/tot*100:0,'var(--pri)','🏆')}<div style="flex:1"><div class="hint">Total terkumpul</div><div style="font-size:19px;font-weight:800">${rp(sv)}</div><div class="hint">dari ${rp(tot)} · ${done.length}/${items.length} tercapai</div></div></div>
    ${need?`<p class="hint" style="margin-top:12px;padding:10px 12px;background:var(--soft);border-radius:12px">💡 Supaya semua goal tepat waktu, sisihkan sekitar <b style="color:var(--ink)">${rp(need)}</b> per bulan.</p>`:''}
    <div class="actions" style="margin-top:12px"><button class="btn" data-act="goalNew">+ Goal baru</button></div></div>
  <div class="sec"><h2>Sedang berjalan</h2></div>
  <div class="glist">${active.length? active.map(x=>goalItem(x.g,x.s)).join('') : '<div class="card empty"><span class="ee">🌱</span>Belum ada goal aktif.<br>Contoh: DP rumah, biaya sekolah anak, umrah, liburan keluarga.</div>'}</div>
  ${done.length?`<div class="sec"><h2>Tercapai 🎉</h2></div><div class="glist">${done.map(x=>goalItem(x.g,x.s)).join('')}</div>`:''}`;
}
function noteItem(n){
  const m=MOODS[(n.mood||3)-1];
  return `<div class="note" data-act="note" data-id="${esc(n.id)}"><div class="nh"><span class="nm">${m[0]}</span><div><b>${dayRel(n.date)}</b><small>Mood: ${m[1]}</small></div></div>
  ${n.text?`<p>${esc(n.text)}</p>`:''}
  ${n.gratitude?`<div class="gr">🙏 ${esc(n.gratitude)}</div>`:''}
  ${(n.tags||[]).length?`<div class="tags">${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}</div>`;
}
function vNotes(){
  const m=today().slice(0,7); const mn=S.notes.filter(n=>n.date.slice(0,7)===m);
  const counts=[0,0,0,0,0]; mn.forEach(n=>counts[(n.mood||3)-1]++);
  const tagc={}; mn.forEach(n=>(n.tags||[]).forEach(t=>tagc[t]=(tagc[t]||0)+1));
  const topTags=Object.entries(tagc).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const list=S.notes.slice().sort((a,b)=>(b.date+(b.createdAt||'')).localeCompare(a.date+(a.createdAt||'')));
  const hasToday=S.notes.some(n=>n.date===today());
  return `<div class="card"><h3>Mood ${MONTHS[new Date().getMonth()]} · ${mn.length} catatan</h3>
    <div class="moodsum">${MOODS.map((x,i)=>`<div>${x[0]}<small>${counts[i]}</small></div>`).join('')}</div>
    ${topTags.length?`<div class="tags" style="margin-top:12px;justify-content:center">${topTags.map(([t,c])=>`<span class="tag">${esc(t)} · ${c}×</span>`).join('')}</div>`:''}
    <div class="actions" style="margin-top:14px"><button class="btn" data-act="noteNew">${hasToday?'+ Tambah catatan':'📝 Tulis catatan hari ini'}</button></div></div>
  <div class="card">${list.length? list.map(noteItem).join('') : '<div class="empty"><span class="ee">📔</span>Catat aktivitas, perasaan, dan hal yang kamu syukuri setiap hari.<br>Kebiasaan kecil, dampak besar.</div>'}</div>`;
}

  open(`<h3>Mau catat apa?</h3><div class="quick">

  <div class="glist" style="margin-top:12px">
    <button class="gitem" data-act="appearance"><div class="ic">🎨</div><div class="gm"><b>Tampilan & tema</b><small>Pantai, Bunga, Galaksi, Gunung, warna, mode gelap</small></div></button>
    <button class="gitem" data-act="bookEdit" data-k="${esc(keyOf(bk))}"><div class="ic">${esc(bk.emoji||'📁')}</div><div class="gm"><b>Atur pos ini</b><small>Nama, ikon, dan fitur yang aktif</small></div></button>
    <button class="gitem" data-act="pocketSetup"><div class="ic">👛</div><div class="gm"><b>Saldo awal</b><small>Kas dan 4 kantong tabungan</small></div></button>
    <button class="gitem" data-act="budget"><div class="ic">🧭</div><div class="gm"><b>Anggaran bulanan</b><small>Batas pengeluaran per kategori</small></div></button>
    <button class="gitem" data-act="banks"><div class="ic">💳</div><div class="gm"><b>Rekening & e-wallet</b><small>Atur daftar bank yang muncul saat mencatat</small></div></button>
    <button class="gitem" data-act="exportCsv"><div class="ic">📤</div><div class="gm"><b>Salin data (CSV)</b><small>Untuk dibuka di Excel / Google Sheets</small></div></button>
    ${window.kkHost?`<button class="gitem" data-act="hostMembers"><div class="ic">👨‍👩‍👧</div><div class="gm"><b>Anggota keluarga</b><small>Email yang boleh membuka pos Bersama</small></div></button>
    <button class="gitem" data-act="hostSignOut"><div class="ic">🚪</div><div class="gm"><b>Keluar</b><small>${esc(window.kkHost.email()||'')}</small></div></button>`:''}
  </div>
  <p class="hint" style="margin-top:14px">💑 Pos <b>Bersama</b> bisa dipakai bersama pasangan: ${window.kkHost?'tambahkan emailnya di <b>Anggota keluarga</b>':'bagikan halaman ini dengan akses <b>Contributor</b>'} — kalian akan melihat dan mengisi data yang sama. Pos <b>Pribadi</b> 🔒 hanya terlihat olehmu.</p>`);
}
async function exportCsv(){
  const rows=[['tanggal','jenis','kategori','rekening','kantong/goal','jumlah','catatan']];
  S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{ const tgt=t.type==='goal'?(S.goals.find(g=>g.id===t.goalId)?.name||''):t.pocket?(pk(t.pocket)?.n||''):''; const jenis={in:'Pemasukan',out:'Pengeluaran',goal:'Setor goal',save:t.dir==='out'?'Tarik tabungan':'Setor tabungan',adj:'Penyesuaian'}[t.type]; rows.push([t.date,jenis,t.cat||'',t.bank||'',tgt,t.amount,(t.note||'').replace(/"/g,'""')]); });
  const csv=rows.map(r=>r.map(x=>`"${x}"`).join(',')).join('\n');
  try{ await navigator.clipboard.writeText(csv); toast('Data disalin — tempel di spreadsheet 📋'); }catch(e){ open(`<h3>Salin data</h3><p class="sub">Pilih semua lalu salin:</p><textarea style="min-height:240px;font-size:12px">${esc(csv)}</textarea>`); }
}
function bankManager(){
  let list=[...banks()];
  const draw=()=>{ open(`<h3>Rekening & e-wallet 💳</h3><p class="sub">Daftar ini muncul saat mencatat transaksi, tabungan, dan setoran goal. Riwayat lama tidak berubah kalau ada yang dihapus.</p>
    ${list.map((b,i)=>`<div class="bankrow">${bankBadge(b)}<div class="bm"><b>${esc(b)}</b><small>${S.tx.filter(t=>t.bank===b).length} transaksi</small></div><button class="x" data-del="${i}" aria-label="Hapus ${esc(b)}">✕</button></div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><input id="bmNew" maxlength="30" placeholder="Tambah bank / e-wallet"><button class="btn sm" id="bmAdd">Tambah</button></div>
    <div class="actions"><button class="btn ghost" id="bmReset">Pakai daftar bawaan</button><button class="btn" id="bmOk">Simpan</button></div>`);
    $('sheet').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ list.splice(+b.dataset.del,1); draw(); });
    $('bmAdd').onclick=()=>{ const n=$('bmNew').value.trim().slice(0,30); if(n&&!list.includes(n)){ list.push(n); draw(); } };
    $('bmReset').onclick=()=>{ list=[...DEFAULT_BANKS]; draw(); };
    $('bmOk').onclick=async()=>{ if(!list.length){toast('Sisakan minimal satu');return} if(await saveConfig({...S.config,banks:list})){close();toast('Daftar rekening tersimpan ✓')} };
  }; draw();
}
function themePickers(st,withMode){
  return `<label>Tema</label><div class="scenes">${Object.entries(SCENES).map(([k,v])=>{ const ac=ACCENTS[st.theme]||ACCENTS.biru; const bg=k==='pastel'?`linear-gradient(135deg,${ac.h[0]},${ac.h[2]})`:v.hero;
      return `<button data-sc="${k}" class="${st.scene===k?'on':''}"><div class="pv" style="background:${bg}">${sceneSvg(k)}</div><b>${v.e} ${v.n}</b></button>`; }).join('')}</div>
    <label>Warna aksen</label><div class="accents">${Object.entries(ACCENTS).map(([k,v])=>`<button data-th="${k}" class="${st.theme===k?'on':''}" style="background:linear-gradient(135deg,${v.g[0]},${v.g[1]})" aria-label="${v.n}" title="${v.n}"></button>`).join('')}</div>
    ${withMode?`<label>Mode</label><div class="seg" style="margin:0">${[['auto','🌗 Otomatis'],['light','☀️ Terang'],['dark','🌙 Gelap']].map(([k,l])=>`<button data-md="${k}" class="${st.mode===k?'on':''}" ${SCENES[st.scene].alwaysDark?'disabled':''}>${l}</button>`).join('')}</div>${SCENES[st.scene].alwaysDark?'<p class="hint" style="margin-top:6px">Tema Galaksi selalu memakai mode gelap 🌌</p>':'<p class="hint" style="margin-top:6px">Mode berlaku di perangkat ini.</p>'}`:''}`;
}
function appearance(){
  const b=curBook(); const st={scene:b.scene||'pastel',theme:b.theme||'biru',mode:getMode()};
  const draw=()=>{ themePreview={...st}; render(); const y=$('sheet').scrollTop;
    open(`<h3>🎨 Tampilan</h3><p class="sub">Untuk pos <b>${esc(b.emoji||'')} ${esc(b.name)}</b>. Lihat perubahannya langsung di belakang.</p>
    ${themePickers(st,true)}
    <div class="actions"><button class="btn ghost" id="apX">Batal</button><button class="btn" id="apOk">Simpan</button></div>`);
    $('sheet').scrollTop=y; $('ov').classList.add('clear');
    $('sheet').querySelectorAll('[data-sc]').forEach(x=>x.onclick=()=>{st.scene=x.dataset.sc;draw();});
    $('sheet').querySelectorAll('[data-th]').forEach(x=>x.onclick=()=>{st.theme=x.dataset.th;draw();});
    $('sheet').querySelectorAll('[data-md]').forEach(x=>x.onclick=()=>{st.mode=x.dataset.md;draw();});
    $('apX').onclick=()=>{ themePreview=null; close(); render(); };
    $('apOk').onclick=async()=>{ try{ localStorage.setItem('kk_mode',st.mode); }catch(e){}
      const meta={name:b.name,emoji:b.emoji,theme:st.theme,scene:st.scene,features:b.features||ALL_ON,createdAt:b.createdAt||new Date().toISOString(),by:b.by||me||null};
      if(!b.private && S.readonly){ toast('Akses kamu hanya lihat — mode tetap disimpan di perangkat ini'); themePreview=null; close(); render(); return; }
      if(!db){ const arr=b.private?S.privBooks:S.sharedBooks; const i=arr.findIndex(x=>x.id===b.id); if(i>=0) arr[i]={...arr[i],...meta}; else arr.push({...meta,id:b.id}); }
      else { $('apOk').disabled=true; try{ await bookMetaRef(b).set(meta); }catch(e){ $('apOk').disabled=false; fail(e); return; } }
      themePreview=null; close(); render(); toast('Tampilan '+SCENES[st.scene].n+' dipakai '+SCENES[st.scene].e); };
  }; draw();
}
function booksSheet(){
  const list=allBooks(); const cur=S.bookKey;
  open(`<h3>Pos keuangan</h3><p class="sub">Setiap pos punya transaksi, tabungan, goals, kalender, dan catatan sendiri.</p>
  <div class="booklist">${list.map(b=>{ const k=keyOf(b); const nf=Object.values(b.features||ALL_ON).filter(x=>x!==false).length;
    return `<div class="bookrow ${k===cur?'on':''}" data-act="bookGo" data-k="${esc(k)}" role="button"><div class="be" style="background:${bookSwatch(b)}">${esc(b.emoji||'📁')}</div>
    <div class="bm"><b>${esc(b.name)}</b><small>${b.private?'🔒 Pribadi':'👥 Bersama'} · ${SCENES[b.scene]?SCENES[b.scene].e+' '+SCENES[b.scene].n:'🫧 Pastel'} · ${nf+2} fitur</small></div>
    <button class="ed" data-act="bookEdit" data-k="${esc(k)}" aria-label="Atur ${esc(b.name)}">✏️</button></div>`; }).join('')}</div>
  <div class="actions"><button class="btn" data-act="bookNew">＋ Buat pos baru</button></div>`);
}
function bookForm(b){
  const isNew=!b; const isMain=b&&b.id==='main'&&!b.private;
  let st={name:b?.name||'',emoji:b?.emoji||'👤',theme:b?.theme||'pink',scene:b?.scene||'pastel',private:isNew? !!me : !!b.private,features:{...ALL_ON,...(b?.features||{})}};
  const draw=()=>{ open(`<h3>${isNew?'Pos baru ✨':'Atur pos'}</h3>
    <label>Nama pos</label><input id="pbName" maxlength="40" placeholder="mis. Budi Personal, Usaha Warung" value="${esc(st.name)}">
    <label>Ikon</label><div class="emojis">${BOOK_EMOJI.map(e=>`<button data-e="${e}" class="${e===st.emoji?'on':''}">${e}</button>`).join('')}</div>
    ${themePickers(st)}
    <label>Siapa yang bisa lihat?</label>
    ${isNew?`<div class="vis"><button data-v="s" class="${!st.private?'on':''}"><b>👥 Bersama</b><small>Semua yang punya akses ke app ini</small></button><button data-v="p" class="${st.private?'on':''}" ${me?'':'disabled'}><b>🔒 Pribadi</b><small>${me?'Hanya kamu, pasangan tidak bisa lihat':'Perlu login di claude.ai'}</small></button></div>`
      : `<p class="hint">${st.private?'🔒 Pribadi — hanya kamu yang bisa lihat.':'👥 Bersama — semua yang punya akses ke app ini.'} (tidak bisa diubah setelah dibuat)</p>`}
    <label>Fitur di pos ini</label>
    <div class="card" style="padding:4px 14px;margin:0;box-shadow:none">
      <div class="toggle"><div class="tm"><b>📊 Beranda & Keuangan</b><small>Selalu aktif</small></div></div>
      ${FEATURES.map(([k,e,n,d])=>`<div class="toggle"><div class="tm"><b>${e} ${n}</b><small>${d}</small></div><button class="sw ${st.features[k]?'on':''}" data-f="${k}" role="switch" aria-checked="${!!st.features[k]}" aria-label="${n}"></button></div>`).join('')}
    </div>
    <div class="actions">${!isNew&&!isMain?'<button class="btn danger" id="pbDel">Hapus</button>':''}<button class="btn ghost" id="pbX">Batal</button><button class="btn" id="pbOk">${isNew?'Buat pos':'Simpan'}</button></div>`);
    const keep=()=>{ st.name=$('pbName').value; };
    $('sheet').querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{keep();st.emoji=x.dataset.e;draw();});
    $('sheet').querySelectorAll('[data-th]').forEach(x=>x.onclick=()=>{keep();st.theme=x.dataset.th;draw();});
    $('sheet').querySelectorAll('[data-sc]').forEach(x=>x.onclick=()=>{keep();st.scene=x.dataset.sc;draw();});
    $('sheet').querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{keep();st.private=x.dataset.v==='p';draw();});
    $('sheet').querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{keep();st.features[x.dataset.f]=!st.features[x.dataset.f];draw();});
    $('pbX').onclick=close;
    if($('pbDel')) $('pbDel').onclick=()=>confirmBox('Hapus pos "'+b.name+'" beserta semua datanya?',()=>deleteBook(b));
    $('pbOk').onclick=async()=>{ keep(); const name=st.name.trim().slice(0,40); if(!name){toast('Beri nama pos dulu');return}
      const meta={name,emoji:st.emoji,theme:st.theme,scene:st.scene,features:st.features,createdAt:b?.createdAt||new Date().toISOString(),by:b?.by||me||null};
      const book={id:b?.id||uid(),private:st.private};
      if(!book.private && S.readonly){toast('Akses kamu hanya lihat');return}
      $('pbOk').disabled=true;
      if(!db){ const arr=book.private?S.privBooks:S.sharedBooks; const i=arr.findIndex(x=>x.id===book.id); if(i>=0) arr[i]={...meta,id:book.id}; else arr.push({...meta,id:book.id}); }
      else { try{ await bookMetaRef(book).set(meta); }catch(e){ $('pbOk').disabled=false; fail(e); return; } }
      close(); if(isNew){ switchBook(keyOf(book)); S.tab='home'; toast('Pos "'+name+'" siap dipakai 🎉'); } else { fixTab(); render(); toast('Pos diperbarui ✓'); }
    };
  }; draw();
}
async function deleteBook(b){
  const key=keyOf(b);
  if(!b.private && S.readonly){toast('Akses kamu hanya lihat');return}
  if(!db){ const arr=b.private?S.privBooks:S.sharedBooks; const i=arr.findIndex(x=>x.id===b.id); if(i>=0) arr.splice(i,1); delete mem[key]; if(S.bookKey===key) switchBook('s:main'); else render(); toast('Pos dihapus'); return; }
  toast('Menghapus pos…');
  if(S.bookKey===key) switchBook('s:main');
  try{
    for(const c of ['tx','goals','notes']){ const sn=await colRef(c,key).get(); for(const d of sn.docs){ await colRef(c,key).doc(d.id).delete(); } }
    await cfgRef(key).delete(); await bookMetaRef(b).delete(); toast('Pos dihapus');
  }catch(e){ fail(e); }
}
function confirmBox(msg,yes){
  open(`<h3>${esc(msg)}</h3><p class="sub">Tindakan ini tidak bisa dibatalkan.</p><div class="actions"><button class="btn ghost" id="cN">Batal</button><button class="btn danger" style="flex:1" id="cY">Hapus</button></div>`);
  $('cN').onclick=close; $('cY').onclick=()=>{ close(); yes(); };
}

// ================= events =================
document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button[data-tab]'); if(nb){ S.tab=nb.dataset.tab; render(); scrollTo({top:0}); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  if(el.tagName==='A') e.preventDefault();
  switch(a){
    case 'quick': if($('ov').classList.contains('show')) close(); else quick(); break;
    case 'tab': S.tab=d.t; render(); scrollTo({top:0}); break;
    case 'month': S.month=shiftMonth(S.month,+d.d); render(); break;
    case 'period': S.period=d.p; render(); break;
    case 'pshift': { const n=+d.d; S.anchor = S.period==='day'? addDays(S.anchor,n) : S.period==='week'? addDays(weekStart(S.anchor),7*n) : shiftMonth(S.anchor.slice(0,7),n)+'-01'; render(); break; }
    case 'calM': S.calMonth=shiftMonth(S.calMonth,+d.d); S.calDay = S.calMonth===today().slice(0,7)? today() : S.calMonth+'-01'; render(); break;
    case 'calDay': S.calDay=d.d; if(d.d.slice(0,7)!==S.calMonth) S.calMonth=d.d.slice(0,7); render(); break;
    case 'calToday': S.calDay=today(); S.calMonth=today().slice(0,7); render(); break;
    case 'tx': txForm(S.tx.find(t=>t.id===d.id)); break;
    case 'txNew': txForm(null,{type:d.type,date:d.date||undefined}); break;
    case 'pocket': pocketSheet(d.k); break;
    case 'pocketMove': pocketMove(d.k,null,d.dir); break;
    case 'pocketAdj': pocketAdj(d.k); break;
    case 'pocketSetup': pocketSetup(); break;
    case 'goal': goalSheet(d.id); break;
    case 'goalNew': goalForm(); break;
    case 'goalEdit': goalForm(S.goals.find(g=>g.id===d.id)); break;
    case 'goalDep': goalDeposit(d.id); break;
    case 'goalPick': goalPick(); break;
    case 'note': noteForm(S.notes.find(n=>n.id===d.id)); break;
    case 'noteNew': noteForm(null,{date:d.date||undefined}); break;
    case 'noteMood': noteForm(null,{mood:+d.m,date:today()}); break;
    case 'budget': budgetForm(); break;
    case 'settings': settings(); break;
    case 'exportCsv': exportCsv(); break;
    case 'banks': bankManager(); break;
    case 'books': booksSheet(); break;
    case 'appearance': appearance(); break;
    case 'hostMembers': window.kkHost&&window.kkHost.members(); break;
    case 'hostSignOut': window.kkHost&&window.kkHost.signOut(); break;
    case 'bookGo': if(e.target.closest('.ed')) break; close(); if(d.k!==S.bookKey){ switchBook(d.k); toast('Pindah ke '+curBook().name); } break;
    case 'bookNew': bookForm(); break;
    case 'bookEdit': { const k=parseKey(d.k); bookForm(allBooks().find(b=>b.id===k.id&&b.private===k.private)); break; }
    case 'streakInfo': { const s=streak(); toast(s? `🔥 ${s} hari berturut-turut mencatat. Jangan putus ya!` : 'Catat transaksi atau catatan harian setiap hari untuk menyalakan streak 🔥'); break; }
  }
});
init();
})();
</script>
